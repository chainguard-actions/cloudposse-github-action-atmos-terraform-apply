name: Test Atmos Terraform Apply - Infracost Input
on:
  workflow_dispatch:

jobs:
  test-infracost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with infracost-api-key input provided
        id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          skip-checkout: "true"
          atmos-config-path: >-
            ${{ github.workspace }}/hardened/tests/fixtures/atmos-config
          plan-storage: "false"
          skip-plandiff: "true"
          infracost-api-key: "ic-test-api-key-placeholder"
          token: ${{ github.token }}

      - name: Assert action ran with infracost-api-key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # The action is expected to fail gracefully because there is no real
          # atmos/terraform environment. The important thing is that the
          # infracost-api-key input was accepted and the action did not crash
          # due to an unrecognized input.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real atmos/terraform env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
