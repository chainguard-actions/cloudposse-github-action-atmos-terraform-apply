name: Test Atmos Terraform Apply - Actions Disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up atmos config path
        run: |
          echo "ATMOS_CONFIG_PATH=$GITHUB_WORKSPACE/tests/fixtures/atmos-config" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          component: mock-component
          stack: test
          sha: abc1234567890
          atmos-config-path: ${{ env.ATMOS_CONFIG_PATH }}
          skip-checkout: "true"
          plan-storage: "false"
        continue-on-error: true

      - name: Assert action completed (actions disabled path)
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # When github-actions-enabled is false, the apply step is skipped
          # so status output will be empty and the action should succeed
          if [ "$OUTCOME" = "success" ]; then
            # status should be empty since apply was skipped
            echo "PASS: action succeeded with actions disabled (apply skipped)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when atmos settings cannot be resolved)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
