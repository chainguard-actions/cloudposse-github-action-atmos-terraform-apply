name: Test Atmos Terraform Apply - Debug Mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with debug enabled and actions disabled
        id: action
        uses: .
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          skip-checkout: "true"
          atmos-config-path: >-
            ${{ github.workspace }}/tests/fixtures/atmos-config
          plan-storage: "false"
          debug: "true"

      - name: Assert action completed with debug mode
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: '$STATUS'"
          # When github-actions-enabled is false, the apply step is skipped
          # so status output should be empty regardless of debug mode
          if [ -n "$STATUS" ] && [ "$STATUS" != "" ]; then
            echo "FAIL: expected empty status when actions disabled, got: '$STATUS'"
            exit 1
          fi
          echo "PASS: action completed successfully in debug mode with actions disabled"
