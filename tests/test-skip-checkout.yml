name: Test Atmos Terraform Apply - Skip Checkout
on:
  workflow_dispatch:

jobs:
  test-skip-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with skip-checkout true
        id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          skip-checkout: "true"
          atmos-config-path: >-
            ${{ github.workspace }}/tests/fixtures/atmos-config
          plan-storage: "false"
          skip-plandiff: "true"
          token: ${{ github.token }}

      - name: Assert action ran with skip-checkout
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With skip-checkout=true, the action should not attempt a second checkout.
          # The action either succeeds (actions disabled, no apply) or fails gracefully
          # (atmos settings resolution issue). Either is acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with skip-checkout=true (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
