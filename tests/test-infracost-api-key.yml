name: Test infracost-api-key input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal atmos config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/atmos-config-infracost"
          cat > "$GITHUB_WORKSPACE/atmos-config-infracost/atmos.yaml" <<'EOF'
          base_path: "../.."
          components:
            terraform:
              base_path: "components/terraform"
          stacks:
            base_path: "stacks"
            included_paths:
              - "**/*"
            excluded_paths: []
            name_pattern: "{stage}"
          logs:
            level: Info
          EOF

          mkdir -p "$GITHUB_WORKSPACE/stacks"
          cat > "$GITHUB_WORKSPACE/stacks/test.yaml" <<'EOF'
          vars:
            stage: test
          components:
            terraform:
              infracost-test:
                vars: {}
                settings:
                  github:
                    actions_enabled: true
                  integrations:
                    github:
                      gitops:
                        infracost-enabled: true
          EOF

          mkdir -p "$GITHUB_WORKSPACE/components/terraform/infracost-test"
          cat > "$GITHUB_WORKSPACE/components/terraform/infracost-test/main.tf" <<'EOF'
          # minimal terraform component
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          component: infracost-test
          stack: test
          sha: ${{ github.sha }}
          atmos-config-path: ${{ github.workspace }}/atmos-config-infracost
          infracost-api-key: fake-infracost-key-for-coverage
          skip-checkout: "true"
          plan-storage: "false"
          skip-plandiff: "true"

      - name: Assert action ran with infracost-api-key input
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status=$STATUS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without real atmos/AWS setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
