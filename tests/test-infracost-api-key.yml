name: Test Atmos Terraform Apply - Infracost API Key Input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with infracost-api-key input provided
        id: action
        uses: .
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          skip-checkout: "true"
          atmos-config-path: >-
            ${{ github.workspace }}/tests/fixtures/atmos-config
          plan-storage: "false"
          infracost-api-key: "ic-test-dummy-key-for-coverage"
          debug: "false"

      - name: Assert action completed with infracost-api-key provided
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: '$STATUS'"
          # When github-actions-enabled is false, the apply step is skipped
          # so status output should be empty; infracost-api-key is accepted as input
          if [ -n "$STATUS" ] && [ "$STATUS" != "" ]; then
            echo "FAIL: expected empty status when actions disabled, got: '$STATUS'"
            exit 1
          fi
          echo "PASS: action accepted infracost-api-key input and completed with actions disabled"
