name: Test Atmos Terraform Apply - Infracost API Key
on:
  workflow_dispatch:

jobs:
  test-infracost-api-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with infracost-api-key provided
        id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          skip-checkout: "true"
          atmos-config-path: >-
            ${{ github.workspace }}/tests/fixtures/atmos-config
          plan-storage: "false"
          skip-plandiff: "true"
          infracost-api-key: "ic-test-api-key-placeholder"
          token: ${{ github.token }}

      - name: Assert action ran with infracost-api-key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # The action may succeed (if actions disabled / no apply) or fail gracefully
          # (atmos settings cannot be resolved in the harness environment).
          # Either outcome is acceptable — the key requirement is that infracost-api-key
          # is accepted as an input without causing an unexpected error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with infracost-api-key input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
