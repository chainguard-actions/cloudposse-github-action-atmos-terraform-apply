name: Test Atmos Terraform Apply - Infracost API Key Input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with infracost-api-key input
        id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          skip-checkout: "true"
          atmos-config-path: >-
            ${{ github.workspace }}/hardened/tests/fixtures/atmos-config
          plan-storage: "false"
          debug: "false"
          infracost-api-key: "ic-test-api-key-placeholder"

      - name: Assert action ran with infracost-api-key input
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: '$STATUS'"
          # The action is expected to either:
          # 1. Succeed with a status output (unlikely without real infra)
          # 2. Fail gracefully because github-actions-enabled is false in fixture config
          #    (the apply step is skipped, status is empty, action exits 0)
          # 3. Fail because atmos settings can't be resolved
          # In all cases, the action must not crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully (status='$STATUS')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without real infrastructure"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
