name: Test Atmos Terraform Apply - Infracost API Key Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          component: mock-component
          stack: test
          sha: abc1234567890
          atmos-config-path: >-
            ${{ github.workspace }}/hardened/tests/fixtures/atmos-config
          skip-checkout: "true"
          plan-storage: "false"
          infracost-api-key: "ic-test-fake-key-for-coverage"
        continue-on-error: true

      - name: Assert action ran with infracost-api-key input
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          # The action will fail gracefully because it needs real AWS credentials
          # and a real terraform component. The important thing is that the
          # infracost-api-key input was accepted and the action ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS/terraform setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
