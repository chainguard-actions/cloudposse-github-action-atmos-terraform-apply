name: Test Atmos Terraform Apply - Plan Storage Disabled
on:
  workflow_dispatch:

jobs:
  test-plan-storage-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with plan-storage disabled
        id: action
        uses: .
        continue-on-error: true
        with:
          component: test-component
          stack: test-stack
          sha: ${{ github.sha }}
          skip-checkout: "true"
          atmos-config-path: >-
            ${{ github.workspace }}/tests/fixtures/atmos-config
          plan-storage: "false"
          skip-plandiff: "false"
          token: ${{ github.token }}

      - name: Assert action ran with plan-storage disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status output: $STATUS"
          # With plan-storage=false, the action skips plan retrieval steps.
          # Since github-actions-enabled is false in our fixture, ACTIONS_ENABLED=false
          # and the apply step is skipped. The action should succeed.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with plan-storage=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when atmos settings cannot be resolved)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
