name: "Test - Atmos Pro Enabled"

on:
  workflow_dispatch: {}

  pull_request:
    types: [opened, synchronize, reopened]

env:
  AWS_REGION: us-east-2

# Permissions required for assuming AWS identity
permissions:
  id-token: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: echo "Do setup"

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [setup]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Atmos Test Config
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          AWS_REGION_VAL: ${{ env.AWS_REGION }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TERRAFORM_STATE_TABLE: ${{ secrets.TERRAFORM_STATE_TABLE }}
          TERRAFORM_STATE_ROLE: ${{ secrets.TERRAFORM_STATE_ROLE }}
          TERRAFORM_APPLY_ROLE: ${{ secrets.TERRAFORM_APPLY_ROLE }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          cp ./tests/opentofu/atmos.yaml "$RUNNER_TEMP/atmos.yaml"
          sed -i -e 's#__INFRACOST_ENABLED__#false#g' "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_REGION__#$AWS_REGION_VAL#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_BUCKET__#$TERRAFORM_STATE_BUCKET#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_TABLE__#$TERRAFORM_STATE_TABLE#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__STORAGE_ROLE__#$TERRAFORM_STATE_ROLE#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__PLAN_ROLE__#$TERRAFORM_APPLY_ROLE#g" "$RUNNER_TEMP/atmos.yaml"
          sed -i -e "s#__APPLY_ROLE__#$TERRAFORM_APPLY_ROLE#g" "$RUNNER_TEMP/atmos.yaml"

          cat "$RUNNER_TEMP/atmos.yaml"

      - name: Plan Atmos Component
        uses: cloudposse/github-action-atmos-terraform-plan@bab60bca4d25c70bcb469a374cec91759b8305e6 # v4
        with:
          component: "foobar-atmos-pro"
          stack: "plat-ue2-sandbox"
          atmos-config-path: ${{ runner.temp }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Wait 15 sec to wait s3 bucket would be consistent (read after write consistency)
        shell: bash
        run: |
          sleep 15;

      - name: Apply Atmos Pro Component
        id: current
        uses: ./
        with:
          component: "foobar-atmos-pro"
          stack: "plat-ue2-sandbox"
          atmos-config-path: ${{ runner.temp }}
          atmos-version: ">= 1.174.0"

    outputs:
      result: ${{ steps.current.outputs.status }}

  assert:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: nick-fields/assert-action@aa0067e01f0f6545c31755d6ca128c5a3a14f6bf # v2
        with:
          expected: 'succeeded'
          actual: "${{ needs.test.outputs.result }}"

  teardown:
    runs-on: ubuntu-latest
    needs: [assert]
    if: ${{ always() }}
    steps:
      - name: Tear down
        run: echo "Do Tear down"
